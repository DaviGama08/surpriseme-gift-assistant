stages:
  - build
  - test

build:
  stage: build
  image: maven:3.9.11
  script:
    - export NEW_VERSION=${CI_COMMIT_SHA:0:8}-${CI_COMMIT_REF_NAME}
    - mvn versions:set -DnewVersion=1-$NEW_VERSION
    - mvn clean package deploy -s ci_settings.xml
  artifacts:
    paths:
      - target/

unit-test-job:
  stage: test
  image: maven:3.9.11
  needs: ["build"]
  dependencies: ["build"]
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml

sonarcloud-check:
  stage: test
  image: maven:3.9.11
  needs: ["build"]
  dependencies:
    - build
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=gps2526_g42_gps2526_g42 -Dsonar.host.url=https://sonarcloud.io -Dsonar.login="$SONAR_TOKEN"
  allow_failure: true
